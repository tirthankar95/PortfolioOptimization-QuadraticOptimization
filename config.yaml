# Portfolio optimization parameters (read with OmegaConf)
test: true           # Test your models against historical data
budget: 300          # Total investment budget (USD)
monitor_stocks: 10   # Total number of stocks to monitor
yearly_return: 12    # Expected portfolio return (annual, e.g. 0.08 = 8% per year)
mx_share_price_percent: 0.70   # Percentage of budget that may be allocated to a single stock

data:
  years: 3           # Length of history to collect, counted back from today
  ewm_span: 252      # Span for the exponentially weighted (rolling) mean of returns

model_type: "weighted" # Currently there are two options: "weighted" or "normal"
